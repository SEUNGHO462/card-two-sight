apply plugin: 'application'
dependencies {
    api project(':common')
    runtimeOnly('com.mysql:mysql-connector-j:9.5.0') { exclude group: 'com.google.protobuf', module: 'protobuf-java' }
}
application { mainClass = 'kr.ac.c2s.server.ServerLauncher' }

tasks.named('run', JavaExec) {
    workingDir = rootProject.projectDir
    if (System.getProperty('c2s.db.config')) systemProperty 'c2s.db.config', System.getProperty('c2s.db.config')
}
